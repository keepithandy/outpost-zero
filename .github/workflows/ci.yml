name: Browser game quality gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run syntax and simulation tests
        run: npm run check
      - name: Validate asset and document references
        run: |
          test -s index.html
          test -s styles.css
          test -s assets/icons.svg
          test -s assets/cover.svg
          test -s assets/favicon.svg
          test -s manifest.webmanifest
          test -s sw.js
